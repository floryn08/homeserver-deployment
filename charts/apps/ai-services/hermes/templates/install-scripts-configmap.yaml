apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-install-scripts
  namespace: {{ .Values.namespace }}
data:
  50-install-dev-tools: |
    #!/command/with-contenv bash
    set -euo pipefail

    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      build-essential \
      golang-go \
      jq \
      python3-pip \
      shellcheck \
      unzip \
      wget \
      yamllint
    rm -rf /var/lib/apt/lists/*

    arch="$(dpkg --print-architecture)"
    case "${arch}" in
      amd64) binary_arch="amd64" ;;
      arm64) binary_arch="arm64" ;;
      *) echo "Unsupported architecture: ${arch}" >&2; exit 1 ;;
    esac

    service_account_dir="/var/run/secrets/kubernetes.io/serviceaccount"
    kubectl_version="$(curl -fsS --cacert "${service_account_dir}/ca.crt" \
      --header "Authorization: Bearer $(cat "${service_account_dir}/token")" \
      "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/version" \
      | sed -n 's/.*"gitVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | sed 's/+.*//')"
    if [ -z "${kubectl_version}" ]; then
      echo "ERROR: unable to determine cluster kubectl version" >&2
      exit 1
    fi
    curl -fsSLo /usr/local/bin/kubectl \
      "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${binary_arch}/kubectl"
    chmod 0755 /usr/local/bin/kubectl

    helm_version="$(curl -fsSL https://api.github.com/repos/helm/helm/releases/latest \
      | sed -n 's/.*"tag_name":[[:space:]]*"v\([^"]*\)".*/\1/p')"
    if [ -z "${helm_version}" ]; then
      echo "ERROR: unable to determine latest Helm version" >&2
      exit 1
    fi
    curl -fsSLo /tmp/helm.tar.gz \
      "https://get.helm.sh/helm-v${helm_version}-linux-${binary_arch}.tar.gz"
    tar -xzf /tmp/helm.tar.gz -C /tmp
    install -m 0755 "/tmp/linux-${binary_arch}/helm" /usr/local/bin/helm
    rm -rf /tmp/helm.tar.gz "/tmp/linux-${binary_arch}"

    kustomize_version="$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kustomize/releases/latest \
      | sed -n 's/.*"tag_name":[[:space:]]*"kustomize\/\([^"]*\)".*/\1/p')"
    if [ -z "${kustomize_version}" ]; then
      echo "ERROR: unable to determine latest kustomize version" >&2
      exit 1
    fi
    curl -fsSLo /tmp/kustomize.tar.gz \
      "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${kustomize_version}/kustomize_v${kustomize_version}_linux_${binary_arch}.tar.gz"
    tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
    install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
    rm -f /tmp/kustomize /tmp/kustomize.tar.gz

    curl -fsSLo /usr/local/bin/yq \
      "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${binary_arch}"
    chmod 0755 /usr/local/bin/yq

    mkdir -p /etc/hermes
    cat > /etc/hermes/kubeconfig <<EOF
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        certificate-authority: ${service_account_dir}/ca.crt
        server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
    contexts:
    - name: hermes
      context:
        cluster: in-cluster
        user: hermes
    current-context: hermes
    users:
    - name: hermes
      user:
        tokenFile: ${service_account_dir}/token
    EOF
    chmod 0644 /etc/hermes/kubeconfig
