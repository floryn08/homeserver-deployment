apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: {{ .Release.Name }}-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - gateway
            - run
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}
          env:
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HERMES_DASHBOARD_OIDC_ISSUER
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HERMES_DASHBOARD_OIDC_CLIENT_ID
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          ports:
            - containerPort: {{ (index .Values.service.ports 0).containerPort }}
              name: {{ (index .Values.service.ports 0).name }}
              protocol: {{ (index .Values.service.ports 0).protocol }}
          volumeMounts:
            - mountPath: /opt/data
              name: {{ .Release.Name }}-data
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
