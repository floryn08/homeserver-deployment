apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      runtimeClassName: nvidia
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      volumes:
      - name: {{ .Release.Name }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}
      - name: romm-library
        hostPath:
          path: {{ .Values.storage.rommLibraryPath }}
          type: Directory
      - name: eden-keys
        secret:
          secretName: {{ .Release.Name }}
          items:
          - key: prod.keys
            path: prod.keys
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.sharedMemory.sizeLimit }}
      initContainers:
      - name: initialize-eden-keys-directory
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - >-
          mkdir -p /config/.local/share/eden/keys
          && chown -R 1000:1000 /config/.local/share/eden
        volumeMounts:
        - name: {{ .Release.Name }}
          mountPath: /config
          subPath: config
      - name: install-nx-optimizer
        image: {{ .Values.nxOptimizer.image }}
        command:
        - sh
        - -c
        - >-
          set -eu
          && mkdir -p /config/Desktop /config/nx-optimizer
          && if [ ! -f "{{ .Values.nxOptimizer.appImagePath }}" ]; then curl --fail --location --output "{{ .Values.nxOptimizer.appImagePath }}.tmp" {{ .Values.nxOptimizer.downloadUrl }} && mv "{{ .Values.nxOptimizer.appImagePath }}.tmp" "{{ .Values.nxOptimizer.appImagePath }}"; fi
          && chmod 0755 "{{ .Values.nxOptimizer.appImagePath }}"
          && ln -sf "{{ .Values.nxOptimizer.appImagePath }}" /config/nx-optimizer/nx-optimizer
          && printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=NX Optimizer" "Exec=/config/nx-optimizer/nx-optimizer" "Icon=applications-games" "Terminal=false" "Categories=Game;" "Path={{ .Values.nxOptimizer.appImagePath | dir }}" > /config/Desktop/NX\ Optimizer.desktop
          && chmod 0755 /config/Desktop/NX\ Optimizer.desktop
          && chown -R 1000:1000 /config/nx-optimizer /config/Desktop/NX\ Optimizer.desktop
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: {{ .Release.Name }}
          mountPath: /config
          subPath: config
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: BROKER_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.romm.secretName }}
              key: STREAMING_BROKER_SECRET
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}
        ports:
        {{- range $key, $val := $.Values.service.ports }}
        - containerPort: {{ $val.containerPort }}
          name: {{ $val.name }}
          protocol: {{ $val.protocol }}
        {{ end -}}
        volumeMounts:
        {{- range $index, $val := $.Values.storage.volumes }}
        - mountPath: {{ $val.podPath }}
          name: {{ $.Release.Name }}
          subPath: {{ $val.subPath }}
        {{ end -}}
        - mountPath: /romm/library
          name: romm-library
          readOnly: true
        - mountPath: /config/.local/share/eden/keys/prod.keys
          name: eden-keys
          subPath: prod.keys
          readOnly: true
        - mountPath: /dev/dri
          name: dri
          readOnly: true
        - mountPath: /dev/shm
          name: dshm
        startupProbe:
          httpGet:
            path: /health
            port: broker
          failureThreshold: 18
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: broker
          failureThreshold: 5
          periodSeconds: 10
          timeoutSeconds: 5
