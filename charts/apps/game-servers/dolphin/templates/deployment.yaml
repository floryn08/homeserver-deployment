apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      volumes:
      - name: {{ .Release.Name }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}
      - name: romm-library
        hostPath:
          path: {{ .Values.storage.rommLibraryPath }}
          type: Directory
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      initContainers:
      - name: initialize-config-permissions
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - >-
          mkdir -p /config/.config/dolphin-emu /config/.local/share/dolphin-emu
          && chown -R 1000:1000 /config/.config/dolphin-emu /config/.local/share/dolphin-emu
        volumeMounts:
        - name: {{ .Release.Name }}
          mountPath: /config
          subPath: config
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: BROKER_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.romm.secretName }}
              key: STREAMING_BROKER_SECRET
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}
        ports:
        {{- range $key, $val := $.Values.service.ports }}
        - containerPort: {{ $val.containerPort }}
          name: {{ $val.name }}
          protocol: {{ $val.protocol }}
        {{ end -}}
        volumeMounts:
        {{- range $index, $val := $.Values.storage.volumes }}
        - mountPath: {{ $val.podPath }}
          name: {{ $.Release.Name }}
          subPath: {{ $val.subPath }}
        {{ end -}}
        - mountPath: /romm/library
          name: romm-library
          readOnly: true
        - mountPath: /dev/dri
          name: dri
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: broker
          failureThreshold: 18
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: broker
          failureThreshold: 5
          periodSeconds: 10
          timeoutSeconds: 5
