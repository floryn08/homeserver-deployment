apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
{{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .externalPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
{{- end }}
