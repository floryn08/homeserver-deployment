image: linuxserver/radarr:6.4.4
namespace: media-management

host:
  subdomain: radarr

secrets:
  domain:
    key: homeDomain
    path: kv/data/domains

storage:
  appdataBasePath: /srv/appdata/media-management/radarr
  volumes:
  - name: config
    subPath: config
    podPath: /config
    type: DirectoryOrCreate
    readOnly: false

radarr4k:
  host:
    subdomain: radarr-4k
  storage:
    appdataBasePath: /srv/appdata/media-management/radarr-4k
    volumes:
    - name: config
      subPath: config
      podPath: /config
      type: DirectoryOrCreate
      readOnly: false

service:
  type: ClusterIP
  ports:
  - name: http
    containerPort: 7878
    externalPort: 7878
    protocol: TCP