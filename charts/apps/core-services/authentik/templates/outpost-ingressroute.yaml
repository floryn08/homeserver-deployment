apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-outpost
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: authentik-server
          port: http
  tls: {}
