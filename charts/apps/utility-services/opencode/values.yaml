image: ghcr.io/anomalyco/opencode:1.18.20
namespace: utility-services

host:
  subdomain: opencode

secrets:
  domain:
    key: homeDomain
    path: kv/data/domains

storage:
  appdataBasePath: /srv/appdata/utility-services/opencode
  size: 5Gi
  volumes:
  - name: data
    subPath: data
    podPath: /root/.local/share/opencode
    type: DirectoryOrCreate
  - name: config
    subPath: config
    podPath: /root/.config/opencode
    type: DirectoryOrCreate

ollama:
  baseUrl: http://ollama.ai-services.svc:11434/v1

service:
  type: ClusterIP
  ports:
  - name: http
    containerPort: 4096
    externalPort: 4096
    protocol: TCP
