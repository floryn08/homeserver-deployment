image: ghcr.io/anomalyco/opencode:1.18.20
namespace: utility-services

host:
  subdomain: opencode

secrets:
  domain:
    key: primaryDomain
    path: kv/data/domains

storage:
  appdataBasePath: /srv/appdata/utility-services/opencode
  size: 5Gi
  volumes:
  - name: data
    subPath: data
    podPath: /home/opencode/.local/share/opencode
    type: DirectoryOrCreate
  - name: config
    subPath: config
    podPath: /home/opencode/.config/opencode
    type: DirectoryOrCreate

tools:
  packages:
  - bash
  - build-base
  - ca-certificates
  - curl
  - git
  - go
  - helm
  - jq
  - kubectl
  - kustomize
  - npm
  - openssh-client
  - py3-pip
  - python3
  - ripgrep
  - shellcheck
  - tar
  - unzip
  - wget
  - yamllint
  - yq

service:
  type: ClusterIP
  ports:
  - name: http
    containerPort: 4096
    externalPort: 4096
    protocol: TCP
