image: vaultwarden/server:1.37.1
namespace: utility-services

backup:
  enabled: true
  resticImage: restic/restic:0.19.1
  rcloneImage: rclone/rclone:1.75.0

host:
  subdomain: vault

secrets:
  domain:
    key: primaryDomain
    path: kv/data/domains

storage:
  appdataBasePath: /srv/appdata
  volumes:
  - name: data
    subPath: data
    podPath: /data
    type: DirectoryOrCreate

service:
  type: ClusterIP
  ports:
  - name: http
    containerPort: 80
    externalPort: 9765
    protocol: TCP
  